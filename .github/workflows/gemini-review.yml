name: Gemini PR Review (inline)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest

    # Можно быстро поменять желаемую модель тут
    env:
      GEMINI_PREFERRED_MODEL: gemini-2.5-flash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # Префлайт: определяем фактическую модель, доступную для ключа
      - name: Detect available Gemini model
        id: models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PREFERRED_MODEL: ${{ env.GEMINI_PREFERRED_MODEL }}
        run: |
          set -euo pipefail

          # Получаем список моделей
          resp=$(curl -sS "https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}")
          echo "$resp" > models_raw.json

          # Извлекаем имена без префикса "models/"
          jq -r '.models[].name' models_raw.json | sed 's|^models/||' > models.txt || true
          echo "Available models:"
          cat models.txt || true

          pick_model() {
            wanted="$1"
            if grep -qx "$wanted" models.txt; then
              echo "$wanted"
              return 0
            fi
            return 1
          }

          # 1) Пытаемся взять желаемую (по умолчанию gemini-2.5-flash)
          MODEL=""
          if pick_model "$GEMINI_PREFERRED_MODEL" >/dev/null 2>&1; then
            MODEL="$GEMINI_PREFERRED_MODEL"
          fi

          # 2) Если нет — пробуем стабильную предыдущую
          if [ -z "$MODEL" ] && pick_model "gemini-2.0-flash" >/dev/null 2>&1; then
            MODEL="gemini-2.0-flash"
          fi

          # 3) Если и её нет — берём любую flash
          if [ -z "$MODEL" ]; then
            MODEL=$(grep -E '^gemini-[0-9.]+-flash$' models.txt | head -n1 || true)
          fi

          # 4) В крайнем случае — любую модель
          if [ -z "$MODEL" ]; then
            MODEL=$(head -n1 models.txt || true)
          fi

          if [ -z "$MODEL" ]; then
            echo "Не удалось определить доступную модель Gemini для данного ключа." >&2
            exit 1
          fi

          echo "Using model: $MODEL"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Fetch PR files with patches
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          echo "[]" > files.json
          page=1
          while :; do
            resp=$(curl -sSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls/${PR}/files?per_page=100&page=${page}")
            jq -s '.[0] + .[1]' files.json <(echo "$resp") > files.tmp && mv files.tmp files.json
            [ "$(echo "$resp" | jq 'length')" -lt 100 ] && break
            page=$((page+1))
          done

          # Формируем контекст только из текстовых патчей
          jq -r '.[] | select(.patch) | "### " + .filename + "\n```diff\n" + .patch + "\n```"' files.json \
            > patches_for_llm.md

          # Ограничим объём контекста, чтобы не переполнить модель
          head -c 120000 patches_for_llm.md > context.md

      - name: Ask Gemini for STRUCTURED comments
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          MODEL="${{ steps.models.outputs.model }}"

          cat > prompt.txt << 'EOF'
          You are a strict senior code reviewer. You will receive multiple file diffs.

          Return STRICT JSON ONLY (no code fences) with schema:
          {
            "summary": "short markdown summary",
            "comments": [
              { "path": "exact file path as shown",
                "new_line": <number - line in NEW file (right side)>,
                "comment": "one concise actionable comment; short fix snippet allowed"
              }
            ]
          }

          Rules:
          - Use @@ -a,b +c,d @@ headers to compute "new_line" (right side).
          - Comment only on added/changed lines ('+' lines) or the nearest relevant new_line.
          - At most 15 comments total.
          - Use paths exactly as in the headers (no leading slash). Pure JSON, no markdown fences.
          EOF

          BODY=$(jq -Rs --arg p "$(cat prompt.txt)" --arg c "$(cat context.md)" \
                 '{contents:[{parts:[{text:($p+"\n\n===== DIFFS =====\n"+$c)}]}]}')

          ENDPOINT="https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${GEMINI_API_KEY}"

          # Небольшой ретрай на случай сетевых глитчей/429
          attempt=0
          max_attempts=3
          delay=2
          HTTP_CODE=""
          while [ $attempt -lt $max_attempts ]; do
            HTTP_CODE=$(curl -s -w "%{http_code}" -o gemini_raw.json \
              -X POST -H "Content-Type: application/json" -d "$BODY" "$ENDPOINT") || true

            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi

            # 404 чаще всего = неверное имя модели (защитимся повторным чтением из префлайта)
            if [ "$HTTP_CODE" = "404" ]; then
              echo "Gemini returned 404 (model not found). Endpoint: $ENDPOINT" >&2
              break
            fi

            # Для 429/5xx подождём и повторим
            if [ "$HTTP_CODE" = "429" ] || [ "${HTTP_CODE:0:1}" = "5" ]; then
              attempt=$((attempt+1))
              echo "Gemini HTTP $HTTP_CODE, retry $attempt/$max_attempts after ${delay}s..." >&2
              sleep $delay
              delay=$((delay*2))
            else
              break
            fi
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "{\"summary\":\"Gemini API error ($HTTP_CODE).\",\"comments\":[]}" > structured.json
          else
            # Основной ответ
            text=$(jq -r '.candidates[0].content.parts[0].text // empty' gemini_raw.json)

            # Иногда модель возвращает ```json ... ```
            clean=$(printf "%s" "$text" \
              | sed -e 's/^[[:space:]]*```json[[:space:]]*//' -e 's/^[[:space:]]*```//' -e 's/```[[:space:]]*$//')

            # Если пусто — безопасный фолбэк
            if [ -z "$clean" ] || [ "$clean" = "null" ]; then
              clean='{"summary":"Empty AI response.","comments":[]}'
            fi

            printf "%s" "$clean" > structured.json || true

            # Проверяем валидность JSON; если невалиден — фолбэк
            jq empty structured.json 2>/dev/null || echo '{"summary":"AI output not valid JSON.","comments":[]}' > structured.json
          fi

      - name: Create inline review with robust fallback
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const pull_number = context.issue.number;
            const headSha = context.payload.pull_request.head.sha;

            const files = JSON.parse(fs.readFileSync('files.json','utf8'));
            const out   = JSON.parse(fs.readFileSync('structured.json','utf8'));
            const summary = out.summary || 'AI Review';

            // Build per-file map: new_line -> position in patch
            function buildMap(patch) {
              const map = {};
              let pos = 0;      // position in file patch (continuous)
              let newLine = 0;  // line number in new file side
              for (const raw of patch.split('\n')) {
                const line = raw.replace(/\r$/, '');
                if (line.startsWith('@@')) {
                  const m = /@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
                  if (m) newLine = parseInt(m[1], 10);
                  continue;
                }
                pos++; // position counts for ' ', '+', '-' lines
                if (line.startsWith('+') || line.startsWith(' ')) {
                  map[newLine] = pos;
                  newLine++;
                }
                // '-' does not advance newLine
              }
              return map;
            }

            const maps = {};
            const posComments = [];
            const lineFallback = [];
            const byPath = Object.fromEntries(files.map(f => [f.filename, f]));

            for (const c of (out.comments || [])) {
              const path = String(c.path || '').trim();
              const nl = Number(c.new_line);
              const body = String(c.comment || '').trim();
              if (!path || !nl || !body) continue;

              const file = byPath[path];
              if (!file || !file.patch) { continue; } // skip binaries/missing

              if (!maps[path]) maps[path] = buildMap(file.patch);
              const pos = maps[path][nl];

              if (pos) {
                posComments.push({ path, position: pos, body });
              } else {
                // fallback: comment by line number on HEAD commit (RIGHT side)
                lineFallback.push({ path, line: nl, body });
              }
            }

            // 1) Batch review with positioned comments (fast, native UI)
            if (posComments.length) {
              await github.rest.pulls.createReview({
                owner, repo, pull_number,
                event: 'COMMENT',
                body: summary,
                comments: posComments.slice(0, 15)
              });
            } else {
              // summary как обычный комментарий, если нет позиционных
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull_number,
                body: summary
              });
            }

            // 2) Fallback: per-line comments tied to HEAD commit
            for (const c of lineFallback.slice(0, 15)) {
              try {
                await github.rest.pulls.createReviewComment({
                  owner, repo, pull_number,
                  commit_id: headSha,
                  path: c.path,
                  side: 'RIGHT',
                  line: c.line,
                  body: c.body
                });
              } catch (e) {
                // тихо пропускаем неподходящие строки
              }
            }
